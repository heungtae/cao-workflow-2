[project]
name = "cao-workflows"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.19,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "PyYAML>=6,<7"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# CAO libtmux auto-plugin is unrelated to these tests and incompatible with pytest 9.
addopts = "-p no:libtmux"

[tool.ruff.lint.per-file-ignores]
"scripts/cli.py" = ["E402"]
"scripts/trigger.py" = ["E402"]
